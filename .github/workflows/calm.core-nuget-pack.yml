name: NuGet Pack (Calm.Core)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important for MinVer to calculate version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore source/src/Calm.Core/Calm.Core.csproj

      - name: Build
        run: dotnet build source/src/Calm.Core/Calm.Core.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack source/src/Calm.Core/Calm.Core.csproj --configuration Release --no-build --output ./nupkg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Calm.Core.nupkg
          path: ./nupkg/*.nupkg
